version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: all
  disable:
    # Replaced by gomodguard_v2 in golangci-lint v2.12.
    - gomodguard
    # golangci-lint v2.12.2 bundles honnef.co/go/tools v0.7.0, whose buildir
    # panics while loading Go 1.27's internal/poll package on Linux.
    - staticcheck
    # need to try on
    - promlinter
    - wrapcheck
    # too much false positive / opinionated
    - depguard
    - lll
    - wsl
    - wsl_v5
    - tagliatelle
    - exhaustruct
    - nlreturn
    - varnamelen
    - noinlineerr
    # v2 default rule set is too strict for the existing API-doc style;
    # tracked separately
    - revive
  exclusions:
    generated: lax
    paths:
      - vendor
      - .*/mocks/.*
      - frontend/node_modules
